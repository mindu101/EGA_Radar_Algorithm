car_detector:
  weights_path: "weights/local/best.engine" # Engine built for this GPU
  img_size: 1280
  conf_thres: 0.3   
  iou_thres: 0.5
  max_det: 10
  tracker_config_path: "config/botsort.yaml" # Path to the tracker configuration file
  verbose: false
  

armor_detector:
  class_names: ["B1", "B2", "B3", "B4", "B7", "R1", "R2", "R3", "R4", "R7", "G1", "G2", "G3", "G4", "G7"]
  use_enhanced_detector: true
  armor_detector_type: "two_step" # three_step, three_step

  ##### Weights and size configuration for three step detector
  # weights_path: "weights/armor_pfa_dynamic.engine"
  # img_size: [640, 640]
  
  ##### Weights and size configuration for two step detector
  weights_path: "weights/local/armor_best.engine"
  img_size: 192
  
  ##### Weights and size configuration END

  ##### Post processing configuration for yolo-based detector
  conf_thres: 0.4
  iou_thres: 0.4
  max_det: 4
  verbose: false
  digit_model_type: "mobilenet"
  digit_weights_path: "weights/MobileNetv2.2.pth"

digit_detector:
  digit_confidence_weight: 0.70
  armor_confidence_weight: 0.30
  min_digit_confidence: 0.30
  min_combined_confidence: 0.55
  colored_anchor_min_combined_confidence: 0.30
  gray_anchor_min_combined_confidence: 0.40
  ignored_digit_index: 5

# 车辆检测（A 阶段）与装甲/跟踪融合（B 阶段）的两级流水线。
# 默认值来源：prompt_pipeline.md 第 10.1 节；旧配置缺少此节点时回退串行模式。
detection_pipeline:
  enabled: true
  camera_timeout_sec: 0.10
  max_commit_age_sec: 0.20
  worker_join_timeout_sec: 5.0

# 高可靠相机投影—雷达配对残差的在线统计；仅保存在本次进程内。
projection_lidar_statistics:
  enabled: true
  include_gray_camera_lidar: false
  min_armor_confidence: 0.70
  min_digit_confidence: 0.70
  min_combined_confidence: 0.75
  max_match_distance_m: 0.75
  min_lidar_margin_m: 0.50
  min_camera_margin_m: 0.50
  # ratio=d1/d_second，越小越可靠；无竞争点时为 0。
  max_lidar_ambiguity_ratio: 0.50
  max_camera_ambiguity_ratio: 0.50
  min_sample_interval_sec: 0.20

ray_projection:
  xy_maps_default_enabled: false
  map_dtype: "float32"
  generation_chunk_rows: 64  # 批量计算连续 64 行像素的射线
  lookup_mode: "nearest"
  invalid_value: "nan"
  consistency_check:
    enabled: true
    sample_count: 10
    max_error_m: 0.10

tracker:
  type: "CascadeMatchTracker"
  point_guesser_config_path: "config/guess_pts.yaml"
  cascade:
    unknown_faction_fallback: "red"
    random_seed: 2026

    bot_history:
      queue_size: 30
      matching_window: 10
      decay_tau: 0.5
      association_ttl_frames: 30

    colored_triplet_match:
      max_ray_lidar_distance_m: 1.5
      semantic_cost_weight: 2.0
      ray_distance_cost_weight: 6.0

    gray_match:
      max_ray_lidar_distance_m: 1.5
      semantic_cost_weight: 1.5
      track_distance_cost_weight: 2.0
      ray_distance_cost_weight: 3.0
      unseen_track_cost: 0.5
      side_cost_margin: 0.15
      enemy_tie_bias: 0.05

    history_lidar_match:
      max_distance_m: 2.0
      unmatched_cost: 100.0
      invalid_edge_cost: 1000000.0

    ally_fusion:
      feedback_timeout_sec: 0.15
      max_lidar_match_distance_m: 1.5
      feedback_r_std_m: 0.0
      age_r_std_per_sec: 0.0
      update_kf_without_lidar: true

    position_kalman:
      default_dt_sec: 0.033333
      min_dt_sec: 0.001
      max_dt_sec: 0.20
      process_q_std: 2.0
      lidar_r_std_m: 0.20
      initial_position_std_m: 0.25
      initial_velocity_std_mps: 2.0
      hard_reset_distance_m: 2.5

    loss:
      radar_guess_after_frames: 10
      fixed_guess_after_frames: 30

    guessing:
      enemy_only: true
      role_priority: ["hero", "standard_3", "standard_4", "sentry", "engineer"]

visualization:
  enabled: true                 # 是否启动只供 UI 使用的异步检测/追踪叠图线程
  single_view: true             # 检测与追踪合并为一个 UI 视图
  separate_detection_view: false # 禁止额外生成一张全分辨率检测图
  update_hz: 30.0               # 后台叠图最高刷新频率，与定位处理帧率解耦
  output_max_width: 1280        # 后台先缩小再画框，主线程不复制 4024x3036 大图
  output_max_height: 960
  box_thickness: 5              # 检测框/追踪框线宽
  label_font_scale: 1.5         # 检测框/追踪框标签字体大小
  label_font_thickness: 2       # 检测框/追踪框标签字体线宽
  label_offset_y: 10            # 标签相对框左上角向上的偏移像素
  panel_title_font_scale: 0.7   # 追踪状态面板标题字体大小
  panel_text_font_scale: 1.0    # 追踪状态面板内容字体大小
  panel_font_thickness: 1       # 追踪状态面板字体线宽

lidar_fusion:
  enabled: true
  topic: "/livox/lidar_cluster"
  queue_size: 10
  max_snapshot_age_sec: 0.20
  mirror_for_blue: true
  field_length: 28.0
  field_width: 15.0

device: "cuda"
